[package]
name = "almanac-core"
version = "0.1.0"
edition = "2021"
description = "Almanac headless core engine — runs and is testable without the Tauri shell"

[lib]
name = "almanac_core"
path = "src/lib.rs"

[[bin]]
name = "almanac-core"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
base64 = "0.22.1"
candle-core = "0.11.0"
candle-transformers = "0.11.0"
chrono = "0.4.45"
dirs = "6.0.0"
dotenvy = "0.15.7"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["form"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sha2 = "0.11.0"
tokenizers = "0.23.1"
tokio = { version = "1.52.3", features = ["macros", "rt", "time"] }
tract-onnx = "0.23.4"
url = "2.5.8"

[dev-dependencies]
chrono-tz = "0.10.4"
serde = "1.0.228"
serde_json = "1.0.150"
static_assertions = "1.1.0"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
