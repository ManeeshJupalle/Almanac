name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build core
        run: cargo build -p almanac-core --locked
      - name: Test core
        run: cargo test -p almanac-core --locked
      - name: Headless self-check
        run: |
          out=$(cargo run -p almanac-core --bin almanac-core --locked -- --self-check)
          echo "$out"
          test "$out" = "core ok"

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
